name: gate2-blinded-coverage

on:
  pull_request:
    paths:
      - 'src/buildBlindManifest.js'
      - 'scripts/render_blind_sheets.py'
      - '.github/workflows/gate2-blinded-coverage.yml'
      - 'data/calibration-sample.tsv'
      - 'src/estateSalesClient.js'
      - 'src/ingest.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-blinded-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: npm test
      - name: Rebuild Gate 1 manifest
        run: npm run ingest -- data/calibration-sample.tsv out/calibration-ingest.jsonl
      - name: Build opaque household manifest and coding forms
        run: npm run gate2:blind -- out/calibration-ingest.jsonl out/gate2
      - name: Verify coding packet has no obvious source leakage
        run: |
          if grep -R -E -i 'estatesales\.net|Memphis|Houston|Chicago|Atlanta|Denver|Seattle|Phoenix|2010|2013|2016|2019|2022|2025|sale_id|source_url' out/gate2/coding-packet; then
            echo 'Blinding leak detected in coding packet' >&2
            exit 1
          fi
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Render blinded contact sheets
        run: python scripts/render_blind_sheets.py out/gate2/private/render-manifest.jsonl out/gate2/coding-packet
      - name: Require complete image rendering
        run: |
          python - <<'PY'
          import json
          s=json.load(open('out/gate2/coding-packet/render-summary.json'))
          print(s)
          if s['households'] != 20:
              raise SystemExit('Expected 20 households')
          if s['download_failures'] != 0:
              raise SystemExit(f"Image download failures: {s['download_failures']}")
          PY
      - name: Upload blinded coding packet only
        uses: actions/upload-artifact@v4
        with:
          name: gate2-blinded-coding-packet
          path: out/gate2/coding-packet
          if-no-files-found: error
          retention-days: 30
