name: gate1-ingestion

on:
  push:
    paths:
      - '.github/workflows/gate1-ingestion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run offline unit tests
        run: npm test

      - name: Run Gate 1 ingestion audit
        run: npm run ingest -- data/calibration-sample.tsv out/calibration-ingest.jsonl

      - name: Print compact ingestion summary
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises';
          const text = await readFile('out/calibration-ingest.jsonl', 'utf8');
          const rows = text.trim().split(/\n+/).filter(Boolean).map(JSON.parse);
          const ok = rows.filter((r) => r.status === 'ok');
          const errors = rows.filter((r) => r.status !== 'ok');
          console.log(`records=${rows.length} ok=${ok.length} errors=${errors.length}`);
          for (const row of rows) {
            console.log([
              row.sample_id,
              row.year,
              row.sale_id,
              row.status,
              row.raw_picture_count ?? '-',
              row.unique_picture_count ?? '-',
              row.error ?? '',
            ].join('\t'));
          }
          EOF

      - name: Upload ingestion audit
        uses: actions/upload-artifact@v4
        with:
          name: gate1-calibration-ingest
          path: out/calibration-ingest.jsonl
          if-no-files-found: error
          retention-days: 30
